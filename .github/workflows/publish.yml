name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test and build dependencies
        run: python -m pip install ".[dev,web]" build twine

      - name: Check the release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          import yapify

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must be v{version} to match pyproject.toml")
          if yapify.__version__ != version:
              raise SystemExit("Update yapify.__version__ to match pyproject.toml")
          PY

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yapify
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      # Register RayST3/yapify, publish.yml, and environment pypi on PyPI.
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
