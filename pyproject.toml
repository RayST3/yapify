[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "yapwrap"
version = "0.0.1a1"
description = "Framework-agnostic streaming voice pipeline for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "YapWrap Contributors" }]
keywords = ["voice", "agent", "llm", "stt", "tts", "vad", "realtime", "streaming"]
dependencies = [
    "typing-extensions>=4.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
audio = ["numpy>=1.24.0"]
local = ["sounddevice>=0.5.0"]
web = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "websockets>=13.0"]
websockets = ["websockets>=13.0"]
webrtc = ["aiortc>=1.9.0"]
silero = ["silero-vad>=6.0.0", "onnxruntime>=1.16.0", "numpy>=1.24.0"]
webrtc-vad = ["webrtcvad>=2.0.10"]
deepgram = ["websockets>=13.0"]
cartesia = ["websockets>=13.0"]
openai = ["openai>=1.50.0"]
elevenlabs = ["websockets>=13.0", "httpx>=0.27.0"]
all = [
    "numpy>=1.24.0",
    "websockets>=13.0",
    "onnxruntime>=1.16.0",
    "silero-vad>=6.0.0",
    "sounddevice>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "aiortc>=1.9.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yapwrap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[dependency-groups]
examples = [
    "agno>=3.1.5",
    "google-genai>=2.31.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
